<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Task Manager</title>
  </head>
  <body>
    <header>
      <h1>Task Management</h1>
    </header>
    <main>
      <div class="new-task">
        <label for="newtask-input">Add a Task</label><br />
        <input id="newtask-input" type="text" placeholder="add task here" />
        <label for="task-priority">Priority</label>
        <select id="task-priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <p id="input-error"></p>
        <button id="add-task-btn">Add</button>
      </div>
      <div class="task-search">
        <label for="search-input">Search tasks</label>
        <input
          type="search"
          id="search-input"
          placeholder="Search your tasks..."
        />
      </div>
      <div class="filter-container">
        <button class="filter-button" id="all-filter">All</button>
        <button class="filter-button" id="active-filter">Active</button>
        <button class="filter-button" id="comp-filter">Completed</button>
      </div>

      <div class="stats">
        <div class="all-stat-container">
          <p>Total tasks:</p>
          <p id="all-task-stat"></p>
        </div>
        <div class="completed-stat-container">
          <p>Completed tasks:</p>
          <p id="completed-task-stat"></p>
        </div>
        <div class="active-stat-container">
          <p>Active tasks:</p>
          <p id="active-task-stat"></p>
        </div>
      </div>
      <div class="tasks">
        <ul id="task-list"></ul>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
